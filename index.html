<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#fffdf6">
    <meta name="description" content="Yunhai Wei · Tsinghua University · School of Software">
    <title>Yunhai Wei · CloudzEa</title>
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/js/language.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#about" data-copy="skip">Skip to content</a>

    <header class="site-header page-width">
      <a class="brand" href="https://github.com/CloudzEa" lang="en">
        CloudzEa <span class="external-arrow" aria-hidden="true">↗</span>
      </a>

      <div class="language-controls" role="group" aria-label="Language" hidden>
        <button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="true">EN</button>
        <button type="button" data-language="zh" lang="zh-CN" aria-label="简体中文" aria-pressed="false">中文</button>
      </div>
    </header>

    <main id="about" class="page-width" tabindex="-1">
      <section class="introduction" aria-labelledby="name">
        <div class="introduction-copy">
          <p class="eyebrow" data-copy="about">About</p>
          <div class="name-line">
            <h1 id="name" lang="en">Yunhai Wei</h1>
            <span class="mint-sticker" aria-hidden="true">✳</span>
          </div>
          <p class="role-sticker" lang="en">PhD（Pizza Hut Delivery） Student</p>
          <p class="affiliation" lang="en">
            <span>Tsinghua University</span>
            <span class="school">School of Software</span>
          </p>
        </div>

        <figure class="portrait">
          <img
            src="assets/images/avatar.webp"
            width="640"
            height="697"
            alt="Yunhai Wei's chosen avatar"
            data-alt="portrait"
            fetchpriority="high"
            decoding="async"
          >
        </figure>
      </section>
    </main>

    <footer class="site-footer page-width">
      <span lang="en">Yunhai Wei</span>
      <span class="pizza" aria-hidden="true">🍕</span>
    </footer>

    <p class="visually-hidden" id="language-status" role="status" aria-live="polite"></p>
  </body>
</html>
